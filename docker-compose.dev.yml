services:
  db:
    image: postgres:16-alpine
    container_name: distrikriss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: distrikriss
      POSTGRES_PASSWORD: distrikriss
      POSTGRES_DB: distrikriss
    ports:
      - "5432:5432"
    volumes:
      - distrikriss_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distrikriss -d distrikriss"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  distrikriss_pgdata:
